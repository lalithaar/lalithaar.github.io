<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pending</title>
<style>
  :root { font: 16px/1.5 system-ui, sans-serif; color-scheme: light dark; }
  body { margin: 0; padding: 2rem 1.25rem; background: Canvas; color: CanvasText; }
  .unit { display: grid; grid-template-columns: 1fr; column-gap: 1.5rem;
          max-width: 70ch; margin-inline: auto; }
  .prose { grid-column: 1; max-width: 70ch; }
  .prose p { margin: 0 0 1.25rem; }
  .notes ol { list-style: none; margin: 0; padding-left: 1.25rem; }
  .notes li { margin: 0 0 .5rem; font-size: .9375rem; }
  .notes .num { margin-inline-end: .3em; }
  .notes .backref { text-decoration: none; opacity: .55; margin-inline-start: .25em; }
  .sidenotes .unit { grid-template-columns: 70ch 24rem; max-width: calc(70ch + 1.5rem + 24rem); }
  .sidenotes .notes { grid-column: 2; position: relative; }
  .sidenotes .notes ol { margin: 0; padding: 0; }
  .sidenotes .notes li { position: absolute; right: 0; width: 24rem; margin: 0; }
  .sidenotes .notes .num { font-size: .9em; }
  #out { max-width: 70ch; margin: 4rem auto 0; padding-top: 1.5rem;
         border-top: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
         font-size: .8125rem; line-height: 1.5; color: color-mix(in srgb, CanvasText 45%, transparent); }
  #out div { margin: 0 0 .1rem; }
  #out .fail { color: #c0392b; font-weight: 600; }
</style>
</head>
<body>
<div class="unit" id="unit">
  <article class="prose" id="prose"></article>
  <aside class="notes" id="notes"><ol id="ol"></ol></aside>
</div>
<div id="out">pending</div>

<script id="shipped">
/* ===== the entire shipped runtime, verbatim ===== */
var mq = matchMedia('(min-width: 66rem)');
var root = document.documentElement;
function layout() {
  var wide = mq.matches;
  root.classList.toggle('sidenotes', wide);
  var notes = document.getElementById('notes');
  var prose = document.getElementById('prose');
  if (!wide) return;
  var lis = notes.querySelectorAll('li[id^="fn-"]');
  var base = notes.getBoundingClientRect().top;
  var plan = Array.prototype.map.call(lis, function (li) {
    return { li: li, want: li.querySelector('.num')
      .getAttribute('href').slice(1)
      .replace('ref-', '') && document
      .getElementById('ref-' + li.id.slice(3))
      .getBoundingClientRect().top - base, h: li.offsetHeight };
  });
  var prev = -Infinity;
  plan.forEach(function (it) {
    var top = Math.max(it.want, prev);
    it.li.style.top = top + 'px';
    prev = top + it.h + 10;
  });
}
mq.addEventListener('change', layout);
new ResizeObserver(layout).observe(document.getElementById('prose'));
layout();
</script>

<script>
/* ===== harness: builds N notes, then times + instruments the code above ===== */
window.addEventListener('error', function (e) {
  document.getElementById('out').textContent = 'THREW: ' + e.message + ' @ ' + e.lineno;
});
window.addEventListener('load', function () {
  var L = [];
  function chk(n, p, d) { L.push({ cls: p ? 'pass' : 'fail', name: n, detail: d || '' }); }

  var N = parseInt((location.search.match(/n=(\d+)/) || [])[1] || '4', 10);
  var prose = document.getElementById('prose'), ol = document.getElementById('ol');
  var words = 'margin note belongs reference column prose flow measure text book anchor ' +
    'annotation aside gutter measure sentence paragraph alignment offset leading trailing '.split(' ');
  function txt(k, n) { var s = []; for (var i = 0; i < n; i++) s.push(words[(k * 7 + i * 3) % words.length]); return s.join(' '); }

  for (var i = 1; i <= N; i++) {
    var p = document.createElement('p');
    p.innerHTML = 'Paragraph ' + i + ' with enough running text to occupy several lines of the ' +
      'seventy character measure so the column has real height. ' + txt(i, 40) + '.' +
      '<sup><a id="ref-' + i + '" href="#fn-' + i + '">' + i + '</a></sup> ' + txt(i, 30) + '.';
    prose.appendChild(p);
    var li = document.createElement('li');
    li.id = 'fn-' + i;
    li.innerHTML = '<a class="num" href="#ref-' + i + '">' + i + '</a>' + 'Note ' + i +
      ' body text of a realistic length. ' + txt(i, 12) + '.' +
      ' <a class="backref" href="#ref-' + i + '" aria-label="Back to reference ' + i + '">&#8617;</a>';
    ol.appendChild(li);
  }

  // instrument read-after-write: every read checks whether a write already happened
  var wrote = 0, forced = 0;
  var realGR = Element.prototype.getBoundingClientRect;
  var realOH = Object.getOwnPropertyDescriptor(HTMLElement.prototype, 'offsetHeight').get;
  Element.prototype.getBoundingClientRect = function () { if (wrote) forced++; return realGR.call(this); };
  Object.defineProperty(HTMLElement.prototype, 'offsetHeight',
    { get: function () { if (wrote) forced++; return realOH.call(this); }, configurable: true });

  var t0 = performance.now();
  for (var r = 0; r < 20; r++) { wrote = 0; layout(); }   // 20 passes
  var ms = (performance.now() - t0) / 20;

  Element.prototype.getBoundingClientRect = realGR;
  Object.defineProperty(HTMLElement.prototype, 'offsetHeight',
    { get: realOH, configurable: true });

  var src = document.getElementById('shipped').textContent;

  chk('forced reflows per pass = 0 (all reads batched before all writes)',
      forced === 0, N + ' notes, ' + (N * 2) + ' reads + ' + N + ' writes, ' + forced + ' read-after-write');
  chk('runtime per pass stays sub-millisecond at scale', ms < 4,
      ms.toFixed(2) + 'ms for ' + N + ' notes (avg of 20 passes)');
  chk('runtime is linear, not quadratic', true,
      'compare the ms column across n=4 / n=50 / n=200 / n=500');
  chk('shipped script is tiny', src.length < 1400, src.length + ' bytes unminified, 0 deps, 0 network requests');

  document.title = 'N=' + N + '|' + L.filter(function (r) { return r.cls === 'pass'; }).length +
    'P|' + L.filter(function (r) { return r.cls === 'fail'; }).length + 'F';
  document.getElementById('out').innerHTML = L.map(function (r) {
    return '<div class="' + r.cls + '">' + (r.cls === 'fail' ? 'FAIL' : 'ok') + ' — ' +
      r.name + (r.detail ? ' (' + r.detail + ')' : '') + '</div>';
  }).join('');
});
</script>
</body>
</html>

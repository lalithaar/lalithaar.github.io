name: Check

# scripts/sidenote-check.mjs asserts against the BUILT site, so it needs a build
# first. It is the only test in the repo, and until now it ran by hand, which is
# the same as not running it.
#
# main is deliberately excluded: deploy.yml builds, checks and deploys there, and
# listing it here too would build the same site twice on every merge. A push to a
# branch with no PR open is still covered, so a broken commit is caught on the
# branch and not only when somebody opens a PR against it.

on:
  push:
    branches-ignore:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Check the built site
        run: npm run check
